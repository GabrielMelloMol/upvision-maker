name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run lint && npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Sugestões (#83): endpoint do Worker, token do app e WhatsApp. Vazios = o app só oferece o que estiver definido.
          VITE_FEEDBACK_URL: ${{ secrets.FEEDBACK_URL }}
          VITE_FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
          VITE_FEEDBACK_WHATSAPP: ${{ secrets.FEEDBACK_WHATSAPP }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: UpVision Maker ${{ github.ref_name }}
          releaseBody: Baixe o instalador do seu sistema abaixo. No Mac, baixe o .dmg; no Windows, o .exe. O passo a passo para abrir na primeira vez está no README.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
