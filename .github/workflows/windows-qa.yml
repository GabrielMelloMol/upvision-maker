name: windows-qa

# QA no Windows (issue #6): builda o app, roda unitários e E2E no Edge (motor do WebView2)
# e gera screenshots em 100/125/150 %, claro e escuro. Rode em Actions → windows-qa → Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/windows-qa.yml"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci

      - name: Unitários e componentes
        run: npm test

      - name: Build do instalador (NSIS, sem artefatos do updater)
        run: npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Fumaça — o app abre e continua aberto por 20 s
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release -Filter "upvision-maker.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "O app fechou sozinho (código $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id
          Write-Output "App abriu e ficou aberto."

      - name: E2E no Edge
        env:
          PW_CHANNEL: msedge
        run: npx playwright test --grep-invert "telas "

      - name: Screenshots (100/125/150 %, claro e escuro)
        if: always()
        env:
          PW_CHANNEL: msedge
          SHOTS: windows
        run: npx playwright test screens

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-windows
          path: docs/screenshots/windows/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instalador-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-falhas
          path: test-results/
